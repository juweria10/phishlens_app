<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
// Minimal Streamlit component: mirrors a JSON string to the browser's localStorage and reports what is stored.
// No libraries; speaks Streamlit's postMessage protocol directly.
(function () {
  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  }
  var started = false, lastVersion = null;

  function readStore(key) {
    try {
      var raw = window.localStorage.getItem(key);
      var rows = raw ? JSON.parse(raw) : [];
      return { ok: true, rows: Array.isArray(rows) ? rows : [] };
    } catch (e) {
      return { ok: false, rows: [] };   // storage blocked (private mode) or data corrupt
    }
  }

  window.addEventListener("message", function (ev) {
    if (!ev.data || ev.data.type !== "streamlit:render") return;
    var a = ev.data.args || {};
    if (a.payload !== null && a.payload !== undefined && a.version !== lastVersion) {
      try { window.localStorage.setItem(a.store_key, a.payload); } catch (e) { /* ignore */ }
      lastVersion = a.version;
    }
    if (!started) {                       // report stored history once per page load
      started = true;
      send("streamlit:setComponentValue", { value: readStore(a.store_key), dataType: "json" });
    }
    send("streamlit:setFrameHeight", { height: 0 });
  });

  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 0 });
})();
</script>
</body></html>
